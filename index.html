<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dealer visit tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d2229;--mute:#5d6673;--line:#dde1e6;--acc:#1f6f5c;--acc-ink:#fff;--warn:#b4441a;--live:#1f6f5c;--liveBg:#dff2ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--card:#1e2229;--ink:#eceef1;--mute:#9aa3af;--line:#303743;--acc:#4fb79d;--acc-ink:#0c1a16;--warn:#f08a5d;--live:#6fd3b8;--liveBg:#1c3a33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181d;--card:#1e2229;--ink:#eceef1;--mute:#9aa3af;--line:#303743;--acc:#4fb79d;--acc-ink:#0c1a16;--warn:#f08a5d;--live:#6fd3b8;--liveBg:#1c3a33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:26px;margin:4px 0 0;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:70px;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;background:var(--acc);color:var(--acc-ink);cursor:pointer;width:100%;margin-top:14px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:6px 12px;margin:0;font-weight:500;font-size:14px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.who{display:flex;gap:8px;align-items:end}.who>div{flex:1}
.agent{padding:10px 0;border-top:1px solid var(--line)}
.agent:first-of-type{border-top:0}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--bg);color:var(--mute)}
.pill.live{background:var(--liveBg);color:var(--live)}
.pill.warn{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.mute{color:var(--mute);font-size:14px}
.visit{padding:10px 0;border-top:1px solid var(--line)}
.visit:first-of-type{border-top:0}
a{color:var(--acc)}
.gps{font-size:14px;margin-top:8px}
.err{color:var(--warn)}
.empty{color:var(--mute);padding:6px 0}
</style>
</head>
<body>
<main>
  <div class="row"><h1>Dealer visit tracker</h1><button class="ghost" id="rename">Edit names</button></div>
  <p class="sub" id="today"></p>
  <div id="status" class="mute"></div>
  <div id="nav" class="mute"></div>

  <section class="card" id="share" hidden><h2>Send to agents</h2><p class="mute" style="margin:0">This is a separate agent page. Agents open it, pick their name and log their visits. Before sending, give them Contributor access in the Share menu.</p><button id="cp">Copy agent link</button><button class="ghost" id="wa" style="width:100%;margin-top:10px;padding:12px">Send on WhatsApp</button><div class="gps mute" id="cpmsg"></div></section>

  <section class="card">
    <div class="who"><div><label for="me">I’m</label><select id="me"></select></div></div>
    <div id="mine"></div>
  </section>

  <section class="card"><h2>Team today</h2><div id="team"></div></section>
  <section class="card"><h2>Follow-ups</h2><div id="follow"></div></section>
  <section class="card"><h2>Today’s visits</h2><div id="log"></div></section>
</main>

<script>
const DEFAULT_AGENTS = ["Agent 1","Agent 2","Agent 3","Agent 4"];
let agents = DEFAULT_AGENTS.slice();
let visits = [];
let db = null;
let me = null;
let isManager = false;
const LINK = "https://claude.ai/artifact/VYYhwrKNkcHUXHHAfzfovt";
const AGENT_LINK = LINK + "#agent";
const MSG = "Please use this link to check in and out at dealers today: " + AGENT_LINK;
try { me = localStorage.getItem("dvt_me"); } catch(e){}
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dayKey = d => { d = new Date(d); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const hm = t => new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const dur = ms => { const m = Math.max(0, Math.round(ms/60000)); return m<60 ? m+" min" : Math.floor(m/60)+" h "+(m%60)+" min"; };
const mapLink = v => v.inLat!=null ? '<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+v.inLat+','+v.inLng+'">Map</a>' : '<span class="mute">No GPS</span>';

$("today").textContent = new Date().toLocaleDateString([], {weekday:"long", day:"numeric", month:"long", year:"numeric"});

function getPos(){
  return new Promise(res => {
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)}),
      () => res(null), {enableHighAccuracy:true, timeout:12000, maximumAge:0});
  });
}

function renderMe(){
  const sel = $("me");
  if(sel.dataset.sig !== agents.join("|")){
    sel.innerHTML = '<option value="">Choose your name</option>' + agents.map(a=>'<option>'+esc(a)+'</option>').join("");
    sel.dataset.sig = agents.join("|");
  }
  sel.value = agents.includes(me) ? me : "";
  const box = $("mine");
  if(!sel.value){ box.innerHTML = '<p class="empty">Choose your name to check in at a dealer.</p>'; return; }
  const open = visits.find(v => v.agent===me && !v.outAt);
  if(!open){
    box.innerHTML = '<label for="dealer">Dealer name</label><input id="dealer" autocomplete="off">' +
      
      '<button id="cin">Check in</button><div class="gps mute" id="gps">Your GPS location and time are saved automatically when you check in.</div>';
    $("cin").onclick = checkIn;
  } else if(!$("co")){
    box.innerHTML = '<div class="row"><div><strong>'+esc(open.dealer)+'</strong><div class="mute">'+esc(open.area||"")+'</div></div><span class="pill live">In since '+hm(open.inAt)+'</span></div>' +
      '<label for="purpose">Purpose of visit</label><select id="purpose"><option>New dealer onboarding</option><option>Follow-up meeting</option><option>Stock or inventory check</option><option>Payment or documents</option><option>Other</option></select>' +
      '<label for="outcome">Outcome and notes</label><textarea id="outcome"></textarea>' +
      '<label for="fu">Follow-up date</label><input id="fu" type="date">' +
      '<button id="co">Check out</button><div class="gps mute" id="gps">Time and GPS location are saved automatically.</div>';
    $("co").onclick = () => checkOut(open.id);
  }
}

async function checkIn(){
  const dealer = $("dealer").value.trim();
  if(!dealer){ $("gps").innerHTML = '<span class="err">Enter the dealer name first.</span>'; return; }
  $("cin").disabled = true; $("gps").textContent = "Getting your location…";
  const pos = await getPos(), now = Date.now();
  const rec = {agent:me, dealer, inAt:now, day:dayKey(now), outAt:null,
    inLat:pos?pos.lat:null, inLng:pos?pos.lng:null, inAcc:pos?pos.acc:null};
  try { await db.collection("visits").add(rec); } catch(e){ $("cin").disabled=false; $("gps").innerHTML='<span class="err">Could not save. Check your connection and try again.</span>'; }
}

async function checkOut(id){
  $("co").disabled = true; $("gps").textContent = "Getting your location…";
  const pos = await getPos(), now = Date.now();
  const patch = {outAt:now, outLat:pos?pos.lat:null, outLng:pos?pos.lng:null, purpose:$("purpose").value,
    outcome:$("outcome").value.trim(), followUp:$("fu").value||null};
  try { await db.doc("visits/"+id).update(patch); } catch(e){ $("co").disabled=false; $("gps").innerHTML='<span class="err">Could not save. Try again.</span>'; }
}

function render(){
  const today = dayKey(Date.now());
  const mgr = isManager && location.hash !== "#agent";
  $("nav").innerHTML = isManager ? (mgr ? '<a href="#agent">Preview the agent page</a>' : '<a href="#manager">Back to manager page</a>') : "";
  $("share").hidden = !mgr;
  $("rename").hidden = !mgr;
  $("mine").parentElement.hidden = mgr;
  $("team").parentElement.hidden = !mgr;
  if(!mgr) renderMe();
  const scope = v => mgr || v.agent===me;
  const tv = visits.filter(v=>v.day===today && scope(v));
  $("team").innerHTML = agents.map(a=>{
    const mine = tv.filter(v=>v.agent===a), open = mine.find(v=>!v.outAt);
    const st = open ? '<span class="pill live">At '+esc(open.dealer)+' since '+hm(open.inAt)+'</span>'
      : mine.length ? '<span class="pill">Last out '+hm(Math.max(...mine.map(v=>v.outAt)))+'</span>' : '<span class="pill">No visits yet</span>';
    return '<div class="agent row"><div><strong>'+esc(a)+'</strong><div class="mute">'+mine.length+' visit'+(mine.length===1?"":"s")+' today</div></div>'+st+'</div>';
  }).join("");

  const fu = visits.filter(v=>scope(v) && v.followUp && v.followUp>=dayKey(Date.now()-14*864e5)).sort((a,b)=>a.followUp<b.followUp?-1:1);
  $("follow").innerHTML = fu.length ? fu.map(v=>{
    const late = v.followUp<today;
    return '<div class="visit row"><div><strong>'+esc(v.dealer)+'</strong><div class="mute">'+esc(v.agent)+' · '+esc(v.outcome||"")+'</div></div>'+
      '<span class="pill '+(late?"warn":"")+'">'+(late?"Overdue ":"")+esc(v.followUp)+'</span></div>';
  }).join("") : '<div class="empty">No follow-ups scheduled.</div>';

  $("log").innerHTML = tv.length ? tv.map(v=>'<div class="visit"><div class="row"><strong>'+esc(v.dealer)+'</strong><span class="mute">'+esc(v.agent)+'</span></div>'+
    '<div class="mute">'+hm(v.inAt)+(v.outAt?' to '+hm(v.outAt)+' ('+dur(v.outAt-v.inAt)+')':' · still there')+' · '+mapLink(v)+(v.inAcc?' <span>(±'+v.inAcc+' m)</span>':'')+'</div>'+
    (v.area?'<div class="mute">'+esc(v.area)+'</div>':'')+
    (v.purpose?'<div>'+esc(v.purpose)+(v.outcome?': '+esc(v.outcome):'')+'</div>':'')+'</div>').join("") : '<div class="empty">No visits logged today.</div>';
}

window.addEventListener("hashchange", render);
$("me").onchange = e => { me = e.target.value; try{localStorage.setItem("dvt_me", me);}catch(x){} $("mine").innerHTML=""; render(); };
$("cp").onclick = async () => {
  try { await navigator.clipboard.writeText(AGENT_LINK); $("cpmsg").textContent = "Link copied. Paste it to your agents."; }
  catch(e){ prompt("Copy this link", AGENT_LINK); }
};
$("wa").onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent(MSG), "_blank");
$("rename").onclick = async () => {
  const cur = agents.join(", ");
  const v = prompt("Enter the 4 agent names, separated by commas", cur);
  if(!v) return;
  const n = v.split(",").map(s=>s.trim()).filter(Boolean).slice(0,8);
  if(n.length && db){ try{ await db.doc("config/agents").set({names:n}); }catch(e){ alert("Only people with edit access can change names."); } }
};

render();
(async () => {
  const timer = setTimeout(()=>{ $("status").textContent = "Still connecting… shared data may be unavailable."; }, 10000);
  try { db = await claude.use("db"); } catch(e){ db = null; }
  clearTimeout(timer);
  if(!db){ $("status").innerHTML = '<span class="err">Sign in to claude.ai with the account the manager shared this with, otherwise visits can’t be saved.</span>'; return; }
  try { const u = await claude.use("user"); isManager = !!(u && await u.canEdit()); } catch(e){}
  render();
  db.doc("config/agents").onSnapshot(s => { if(s.exists){ const n=s.data().names; if(Array.isArray(n)&&n.length) agents=n; } render(); }, ()=>{});
  db.collection("visits").orderBy("inAt","desc").limit(400).onSnapshot(s => {
    visits = s.docs.map(d => Object.assign({id:d.id}, d.data()));
    render();
  }, e => { $("status").innerHTML = '<span class="err">Could not load visits.</span>'; });
})();
</script>
</body>
</html>
